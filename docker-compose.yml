name: tgbot

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: tgbot:local
    container_name: tgbot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
    volumes:
      # SQLite переживает пересоздание контейнера.
      - bot_data:/app/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
